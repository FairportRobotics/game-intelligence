{% extends "base.html" %}
{% block content %}
{#
  Scan page. The scanner types the QR text and presses Enter. The box must stay focused.
  Uses a <textarea> because a Tab character in the QR data would leave an <input>.

  TODO (Intermediate):
    - Submit on Enter (HTMX: hx-trigger="keydown[key=='Enter']") with hx-post to /scan
    - Put the server's reply at the top of #results (hx-target, hx-swap="afterbegin")
    - Clear and re-focus the box after each scan
#}
<h1>Scan QR codes</h1>
<form hx-post="{{ url_for('scan.scan_submit') }}" hx-target="#results" hx-swap="afterbegin">
  <textarea name="payload" rows="2" autofocus placeholder="Click here, then scan..."></textarea>
  <button type="submit">Save scan</button>
</form>
<h2>Recent scans</h2>
<ul id="results"></ul>
{% endblock %}
